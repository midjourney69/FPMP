<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>FPMP</title>
<style>
:root{color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px/1.5 system-ui,sans-serif;background:light-dark(#f4f4f5,#111113);color:light-dark(#18181b,#e4e4e7)}
form{width:min(340px,90vw);display:grid;gap:12px}
h1{margin:0 0 4px;font-size:28px;letter-spacing:.04em}
input,button{font:inherit;padding:12px 14px;border-radius:10px;min-height:48px}
input{border:1px solid light-dark(#d4d4d8,#3f3f46);background:light-dark(#fff,#18181b);color:inherit;font-size:16px}
button{border:0;background:light-dark(#18181b,#e4e4e7);color:light-dark(#fff,#18181b);font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
label{display:flex;gap:8px;align-items:center;font-size:14px}
input[type=checkbox]{min-height:auto;width:18px;height:18px}
#msg{min-height:1.5em;font-size:14px;color:light-dark(#b91c1c,#f87171)}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>FPMP</h1>
  <input id="p" type="password" placeholder="Mot de passe" autocomplete="current-password" required autofocus>
  <label><input id="r" type="checkbox" checked> Se souvenir sur cet appareil</label>
  <button id="b" type="submit">Entrer</button>
  <div id="msg" role="status"></div>
</form>
<script>
{
const SEL = "fpmp/v1", ITER = 600000, MEMO = "fpmp-cle";
const $ = id => document.getElementById(id);
const b64 = u => btoa(String.fromCharCode(...u));
const deb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = u => Array.from(u, x => x.toString(16).padStart(2, "0")).join("");

async function cles(mdp) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(mdp), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name: "PBKDF2", hash: "SHA-256", salt: new TextEncoder().encode(SEL), iterations: ITER}, base, 512));
}
async function ouvrir(brut) {
  const aes = await crypto.subtle.importKey("raw", brut.slice(0, 32), "AES-GCM", false, ["decrypt"]);
  const r = await fetch("x/0.bin", {cache: "no-cache"});
  if (!r.ok) throw new Error("fichier");
  const d = new Uint8Array(await r.arrayBuffer());
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({name: "AES-GCM", iv: d.slice(0, 12)}, aes, d.slice(12)));
  const shim = "<scr" + "ipt>{const deb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),B=deb64(\"" + b64(brut) + "\");" +
    "const kA=crypto.subtle.importKey(\"raw\",B.slice(0,32),\"AES-GCM\",false,[\"decrypt\"]);" +
    "const kH=crypto.subtle.importKey(\"raw\",B.slice(32),{name:\"HMAC\",hash:\"SHA-256\"},false,[\"sign\"]);" +
    "const hex=u=>Array.from(u,x=>x.toString(16).padStart(2,\"0\")).join(\"\");" +
    "async function lire(p){const n=new Uint8Array(await crypto.subtle.sign(\"HMAC\",await kH,new TextEncoder().encode(p)));" +
    "const r=await fetch(\"x/\"+hex(n).slice(0,24)+\".bin\");if(!r.ok)throw new Error(p);const d=new Uint8Array(await r.arrayBuffer());" +
    "return new TextDecoder().decode(await crypto.subtle.decrypt({name:\"AES-GCM\",iv:d.slice(0,12)},await kA,d.slice(12)));}" +
    "window.__fpmpCharger=src=>lire(src).then(t=>new Promise((ok,ko)=>{const u=URL.createObjectURL(new Blob([t],{type:\"text/javascript\"}));" +
    "const s=document.createElement(\"script\");s.src=u;s.onload=()=>{URL.revokeObjectURL(u);ok();};s.onerror=ko;document.head.appendChild(s);}));}</scr" + "ipt>";
  return html.replace("<!--FPMP-SHIM-->", shim);
}
function afficher(html) { document.open(); document.write(html); document.close(); }

(async () => {
  let memo = null;
  try { memo = localStorage.getItem(MEMO); } catch (e) {}
  if (memo) {
    $("msg").style.color = "inherit"; $("msg").textContent = "Ouverture…";
    try { afficher(await ouvrir(deb64(memo))); return; }
    catch (e) {
      if (e.message !== "fichier") { try { localStorage.removeItem(MEMO); } catch (e2) {} }
      $("msg").textContent = ""; $("msg").style.color = "";
    }
  }
  $("f").addEventListener("submit", async ev => {
    ev.preventDefault();
    $("b").disabled = true; $("msg").style.color = "inherit"; $("msg").textContent = "Vérification…";
    try {
      const brut = await cles($("p").value);
      const html = await ouvrir(brut);
      if ($("r").checked) { try { localStorage.setItem(MEMO, b64(brut)); } catch (e) {} }
      afficher(html);
    } catch (e) {
      $("b").disabled = false; $("msg").style.color = "";
      $("msg").textContent = e.message === "fichier" ? "Site momentanément indisponible, réessaie plus tard." : "Mot de passe incorrect.";
      $("p").select();
    }
  });
})();
}
</script>
</body>
</html>
